# This workflow will lint GitHub Actions workflow files using actionlint.
name: Actionlint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run actionlint
        id: actionlint
        uses: raven-actions/actionlint@e1e2bd5e62e05c92c9c15fef1e5dfa8c7adea87b # v1.2.1
        with:
          flags: -config-file actionlint.yml
